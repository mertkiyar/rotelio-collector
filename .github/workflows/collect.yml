name: Collect flight observations

on:
  workflow_dispatch:
    inputs:
      query_limit:
        description: 'Maximum queries in this batch; earlier batches are retained'
        type: choice
        options: ['1', '120', '240']
        default: '240'
  schedule:
    # Turkey: 09:17, 12:17, 15:17, 18:17; 21:17 recovery slot.
    # Python applies the anchored three-day interval across month boundaries.
    - cron: '17 6,9,12,15,18 * * *'

permissions:
  contents: read

concurrency:
  group: flight-pool-writer
  cancel-in-progress: false

jobs:
  collect:
    # Private execution must not consume the owner's included private minutes.
    # Scheduling stays disabled until the first hosted access check succeeds.
    if: ${{ github.event.repository.private == false && (github.event_name == 'workflow_dispatch' || vars.COLLECTION_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      FLIGHT_BROWSER_CHANNEL: chromium
      DATA_VAULT_REPOSITORY: ${{ vars.DATA_VAULT_REPOSITORY }}
      QUERY_LIMIT: ${{ inputs.query_limit || '240' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify private vault access
        env:
          DATA_VAULT_TOKEN: ${{ secrets.DATA_VAULT_TOKEN }}
        run: python -c "from vault import GitHubVault; GitHubVault().verify_private(); print('Private vault access verified.')"
      - name: Run offline tests
        run: |
          python -m unittest discover -s transportation/tests
          python -m unittest discover -s tests
      - name: Check refresh-cycle coverage
        id: coverage
        env:
          DATA_VAULT_TOKEN: ${{ secrets.DATA_VAULT_TOKEN }}
        run: python cloud_runner.py --limit "$QUERY_LIMIT" --check
      - name: Install runtime
        if: steps.coverage.outputs.needs_collection == 'true'
        run: |
          python -m pip install -r transportation/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Collect and checkpoint
        if: steps.coverage.outputs.needs_collection == 'true'
        env:
          DATA_VAULT_TOKEN: ${{ secrets.DATA_VAULT_TOKEN }}
        run: python cloud_runner.py --limit "$QUERY_LIMIT"
